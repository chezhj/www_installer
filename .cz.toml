# Commitizen config for releasing the deploy tooling itself.
# Release flow (see README): `cz bump` bumps this version + writes the changelog +
# creates a v<version> tag, then `git push` + `git push origin v<version>` (the tag is
# lightweight, so --follow-tags would skip it). The tag push triggers
# .github/workflows/sync-tools.yml, which pins ~/deploy-tools on the server to it.
#
# commitizen is installed on the releasing machine, not in this repo (no Python env here).
# If `cz` is not on PATH, use `py -m commitizen bump` (or `python -m commitizen bump`).
#
# Unlike the app repos, this repo has no requirements.txt / frontend to regenerate, so
# there is no pre-bump artifact hook here.
[tool.commitizen]
name = "cz_conventional_commits"
version = "1.3.2"
tag_format = "v$version"
update_changelog_on_bump = true
major_version_zero = false
version_files = [
    ".cz.toml:version",
]
